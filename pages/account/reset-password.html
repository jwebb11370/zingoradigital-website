<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set a New Password — Zingora Digital</title>
  <link rel="icon" type="image/png" href="../../assets/icons/favicon.png">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/account.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body class="account-page">
  <header class="site-header">
    <div class="container header-inner">
      <a href="../../index.html" class="logo">
        <img src="../../assets/icons/logo.png" alt="Zingora Digital" class="logo-img">
      </a>
      <nav class="main-nav" id="mainNav">
        <ul class="nav-list">
          <li><a href="../../index.html" class="nav-link">Home</a></li>
          <li><a href="../about.html" class="nav-link">About</a></li>
          <li><a href="../services.html" class="nav-link">Services</a></li>
        </ul>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        <span class="hamburger"></span>
      </button>
    </div>
  </header>

  <section class="account-hero">
    <div class="account-hero-overlay"></div>
    <div class="container">
      <h1 class="account-hero-title">Set a New Password</h1>
    </div>
  </section>

  <main class="account-main">
    <div class="container">
      <div class="account-panel">
        <h2 class="section-title" style="margin-bottom: 12px;">Restore Account Access</h2>
        <p id="resetPasswordNote" class="account-note">
          Validating your password reset session...
        </p>

        <div id="resetPasswordStatus" class="account-status hidden" aria-live="polite"></div>

        <form class="account-form" id="resetPasswordForm" novalidate>
          <div class="form-group">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" name="newPassword" placeholder="Enter a new password" required autocomplete="new-password">
            <small class="form-hint">Use at least 8 characters.</small>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm New Password</label>
            <input type="password" id="confirm-password" name="confirmPassword" placeholder="Re-enter your new password" required autocomplete="new-password">
          </div>

          <button type="submit" class="btn btn-primary btn-full">Complete Password Reset</button>
        </form>

        <p style="margin-top: 20px; text-align: center;">
          <a href="./index.html" class="form-link">Return to Sign In</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-copy">&copy; 2026 Zingora Digital. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/password-recovery.js"></script>
</body>
</html>
