<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account — Zingora Digital</title>
  <link rel="icon" type="image/png" href="../../assets/icons/favicon.png">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/account.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body class="account-page">

  <!-- ============ HEADER / NAV ============ -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="../../index.html" class="logo">
        <!-- DROP YOUR LOGO: assets/icons/logo.png -->
        <img src="../../assets/icons/logo.png" alt="Zingora Digital" class="logo-img">
      </a>
      <nav class="main-nav" id="mainNav">
        <ul class="nav-list">
          <li><a href="../../index.html" class="nav-link">Home</a></li>
          <li><a href="../about.html" class="nav-link">About</a></li>
          <li><a href="../services.html" class="nav-link">Services</a></li>
          <li><a href="../contact.html" class="nav-link">Contact</a></li>
        </ul>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        <span class="hamburger"></span>
      </button>
    </div>
  </header>

  <!-- ============ ACCOUNT HERO BANNER ============ -->
  <section class="account-hero">
    <!-- DROP BACKGROUND: assets/backgrounds/account-bg.png or .jpg -->
    <div class="account-hero-overlay"></div>
    <div class="container">
      <h1 class="account-hero-title">Your Account</h1>
    </div>
  </section>

  <!-- ============ ACCOUNT PANEL ============ -->
  <main class="account-main">
    <div class="container">
      <div class="account-panel">

        <!-- TAB SWITCHER -->
        <div class="account-tabs">
          <button class="account-tab active" data-tab="login">Sign In</button>
          <button class="account-tab" data-tab="register">Create Account</button>
        </div>

        <!-- ======== SIGN IN FORM ======== -->
        <form class="account-form" id="loginForm" novalidate>
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <input type="email" id="login-email" name="email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" placeholder="Enter your password" required autocomplete="current-password">
          </div>
          <div class="form-row form-row--between">
            <label class="checkbox-label">
              <input type="checkbox" name="remember"> Remember me
            </label>
            <a href="#" class="form-link">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-full">Sign In</button>

          <div class="social-divider"><span>or continue with</span></div>

          <div class="social-login-buttons">
            <!-- DROP ICONS: assets/icons/social-google.png, social-apple.png, etc. -->
            <button type="button" class="btn-social">
              <img src="../../assets/icons/social-google.png" alt="" class="social-btn-icon">
              Google
            </button>
            <button type="button" class="btn-social">
              <img src="../../assets/icons/social-apple.png" alt="" class="social-btn-icon">
              Apple
            </button>
          </div>
        </form>

        <!-- ======== REGISTER FORM ======== -->
        <form class="account-form hidden" id="registerForm" novalidate>
          <div class="form-row form-row--half">
            <div class="form-group">
              <label for="reg-first">First Name</label>
              <input type="text" id="reg-first" name="firstName" placeholder="First name" required autocomplete="given-name">
            </div>
            <div class="form-group">
              <label for="reg-last">Last Name</label>
              <input type="text" id="reg-last" name="lastName" placeholder="Last name" required autocomplete="family-name">
            </div>
          </div>
          <div class="form-group">
            <label for="reg-email">Email Address</label>
            <input type="email" id="reg-email" name="email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" name="password" placeholder="Create a password" required autocomplete="new-password">
            <small class="form-hint">At least 8 characters</small>
          </div>
          <div class="form-group">
            <label for="reg-confirm">Confirm Password</label>
            <input type="password" id="reg-confirm" name="confirmPassword" placeholder="Confirm your password" required autocomplete="new-password">
          </div>
          <label class="checkbox-label">
            <input type="checkbox" name="terms" required>
            I agree to the <a href="#" class="form-link">Terms of Service</a> and <a href="#" class="form-link">Privacy Policy</a>
          </label>
          <button type="submit" class="btn btn-primary btn-full">Create Account</button>

          <div class="social-divider"><span>or sign up with</span></div>

          <div class="social-login-buttons">
            <button type="button" class="btn-social">
              <img src="../../assets/icons/social-google.png" alt="" class="social-btn-icon">
              Google
            </button>
            <button type="button" class="btn-social">
              <img src="../../assets/icons/social-apple.png" alt="" class="social-btn-icon">
              Apple
            </button>
          </div>
        </form>

      </div><!-- /.account-panel -->
    </div>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-copy">&copy; 2026 Zingora Digital. All rights reserved.</p>
    </div>
  </footer>

  <script src="../../js/main.js"></script>
  <script src="../../js/account.js"></script>
</body>
</html>
